# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Test
on: [push, workflow_dispatch]


# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
# `contents` is for permission to the contents of the repository.
# `pull-requests` is for permission to pull request
permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  testing:

    runs-on: ubuntu-latest

    # The test suite expects a reachable Redis (conftest defaults to
    # redis://sogo6-redis for the compose stack; CI overrides it to the
    # service container below). Previously SOGO_P_REDIS_URL pointed at a
    # repo secret that was never set — the empty value errored at import:
    # "Redis URL must specify one of the following schemes".
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Voucher JWT signing + AES key must be 32 chars or auth raises
      # S999999 ("SOGO_P_VOUCHER_SECRET is not 32 char long"), failing every
      # login-gated integration test. In CI the JWT is minted + consumed by
      # the same process, so a fixed 32-char test value is fine; deploy-time
      # secrets override it when set.
      SOGO_P_VOUCHER_SECRET: ${{ secrets.SOGO_P_VOUCHER_SECRET || '0123456789abcdef0123456789abcdef' }}
      SOGO_AES_ENC_KEY: ${{ secrets.SOGO_AES_ENC_KEY || 'abcdef0123456789abcdef0123456789' }}
      # Service containers publish to the runner host (job has no
      # `container:`), so the alias `redis` does NOT resolve — use localhost.
      SOGO_P_REDIS_URL: redis://localhost:6379/0

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Set up poetry
      uses: abatilo/actions-poetry@v4.0.0
      with:
          poetry-version: latest

    - name: Install package dependencies
      run: sudo apt install -y libldap2-dev libsasl2-dev

    - name: Install python dependencies
      run: poetry install

    - name: Test with pytest
      run: |
        poetry run pytest --doctest-modules --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html

    - name: Pytest coverage comment
      uses: MishaKav/pytest-coverage-comment@main
      with:
        pytest-xml-coverage-path: ./coverage.xml
        junitxml-path: ./junit/test-results.xml

    - name: Archive unit text
      uses: actions/upload-artifact@v4
      with:
        name: unit-test
        path: ./junit/test-results.xml

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ./htmlcov