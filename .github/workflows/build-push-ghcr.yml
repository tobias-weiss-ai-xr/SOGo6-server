# SPDX-License-Identifier: AGPL-3.0-only
# Build the SOGo6-server image and publish it to GHCR.
# GitHub is the main source repo; GHCR (ghcr.io/tobias-weiss-ai-xr/...) is the image registry.
# Uses a local self-hosted runner (labels: self-hosted, linux, x64, docker).
name: build-push-ghcr

on:
  push:
    branches: [main]
    tags: ["v*", "opencloud-picker"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Full path mirrors the opendesk-nix layout so cluster refs are a clean host-swap:
  #   172.25.24.36:5001/sogo6-server:latest
  #   -> ghcr.io/tobias-weiss-ai-xr/umr/opendesk-edu/opendesk-nix/sogo6-server:latest
  IMAGE_NAME: tobias-weiss-ai-xr/umr/opendesk-edu/opendesk-nix/sogo6-server

jobs:
  build:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR push: use GHCR_TOKEN (PAT with write:packages) if set, else fall back
      # to the auto-generated GITHUB_TOKEN (works for first push / new packages).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
