components:
  schemas:
    Error:
      type: object
      properties:
        error_code:
          type: string
          example: S000000
        error_msg:
          type: string
          example: No Error
        data:
          type: object
          nullable: true
      required:
      - error_code
      - error_msg
    Success:
      type: object
      properties:
        data:
          type: object
        error_code:
          type: string
          example: S000000
        error_msg:
          type: string
          example: No Error
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        total:
          type: integer
        total_pages:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /api/user/v1/auth/login
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      headers:
        X-RateLimit-Retry-After:
          schema:
            type: integer
security:
- bearerAuth: []
tags:
- name: system
  description: System information and configuration
